<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="55%" stop-color="#0a0b10" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Suit Fabric Gradients -->
    <linearGradient id="suitMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="50%" stop-color="#12161f" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>

    <linearGradient id="suitShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1017" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3242" />
      <stop offset="100%" stop-color="#10141d" />
    </linearGradient>

    <!-- Skin Gradients (Chiseled Stylized Shading) -->
    <linearGradient id="skinLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4c2a2" />
      <stop offset="50%" stop-color="#e0a382" />
      <stop offset="100%" stop-color="#c68362" />
    </linearGradient>

    <linearGradient id="skinMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d49372" />
      <stop offset="100%" stop-color="#a8684a" />
    </linearGradient>

    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d5138" />
      <stop offset="100%" stop-color="#5e3221" />
    </linearGradient>

    <!-- Beard & Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2625" />
      <stop offset="50%" stop-color="#171414" />
      <stop offset="100%" stop-color="#0a0808" />
    </linearGradient>

    <!-- Power Crimson Tie -->
    <linearGradient id="crimsonTie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef233c" />
      <stop offset="50%" stop-color="#d90429" />
      <stop offset="100%" stop-color="#8d0801" />
    </linearGradient>

    <!-- Executive Gold Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="35%" stop-color="#ffd700" />
      <stop offset="70%" stop-color="#d4a017" />
      <stop offset="100%" stop-color="#7f5500" />
    </linearGradient>

    <!-- Crisp Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#dce2ec" />
      <stop offset="100%" stop-color="#aeb8c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= STAGE BACKGROUND & HALO ================= -->
  <g id="Background">
    <rect width="800" height="1200" fill="url(#bgGlow)" />
    <circle cx="400" cy="360" r="210" fill="none" stroke="#d90429" stroke-width="1" stroke-dasharray="12 8" opacity="0.3" />
    <ellipse cx="400" cy="1135" rx="190" ry="24" fill="#000000" opacity="0.75" />
  </g>

  <!-- ================= CHARACTER ROOT (RIG-READY GROUPS) ================= -->
  <g id="ExecutiveChad_Rig">

    <!-- ================= LEGS & LOWER BODY ================= -->
    <g id="LowerBody">
      <g id="Leg_L">
        <polygon points="295,670 392,670 382,1075 312,1075" fill="url(#suitMain)" stroke="#080a0f" stroke-width="2" />
        <line x1="342" y1="690" x2="345" y2="1070" stroke="#333e52" stroke-width="2" opacity="0.7" />
        <polygon points="365,670 392,670 382,1075 362,1075" fill="url(#suitShadow)" />
        <path d="M312,1075 L380,1075 L385,1125 L285,1130 C275,1130 278,1105 312,1075 Z" fill="#0b0c10" stroke="#222733" stroke-width="1.5" />
        <path d="M288,1122 L383,1118 L385,1128 L285,1130 Z" fill="#050507" />
        <path d="M315,1085 L345,1085 L330,1105 Z" fill="#252b38" opacity="0.5" />
      </g>

      <g id="Leg_R">
        <polygon points="408,670 505,670 488,1075 418,1075" fill="url(#suitMain)" stroke="#080a0f" stroke-width="2" />
        <polygon points="408,670 435,670 438,1075 418,1075" fill="url(#suitShadow)" />
        <line x1="458" y1="690" x2="455" y2="1070" stroke="#333e52" stroke-width="2" opacity="0.7" />
        <path d="M420,1075 L488,1075 C522,1105 525,1130 515,1130 L415,1125 Z" fill="#0b0c10" stroke="#222733" stroke-width="1.5" />
        <path d="M417,1118 L512,1122 L515,1130 L415,1128 Z" fill="#050507" />
        <path d="M455,1085 L485,1085 L470,1105 Z" fill="#252b38" opacity="0.5" />
      </g>

      <polygon points="292,630 508,630 505,685 400,705 295,685" fill="url(#suitShadow)" />
      <rect x="295" y="625" width="210" height="24" fill="#090a0d" stroke="#1e2430" stroke-width="1" />
      <rect x="376" y="621" width="48" height="32" rx="3" fill="url(#goldGrad)" stroke="#4a3200" stroke-width="2" />
      <rect x="384" y="627" width="32" height="20" rx="1" fill="#0d0f14" />
    </g>

    <!-- ================= LEFT ARM ================= -->
    <g id="Arm_L" transform="translate(215, 310)">
      <g id="UpperArm_L">
        <path d="M10,0 L70,15 L55,195 L-15,185 C-25,110 -15,35 10,0 Z" fill="url(#suitMain)" stroke="#07090d" stroke-width="2" />
        <polygon points="12,8 55,20 40,175 -2,165" fill="#232a38" opacity="0.6" />
        <polygon points="40,20 70,15 55,195 40,175" fill="url(#suitShadow)" />
      </g>
      <g id="Forearm_L" transform="translate(-10, 180)">
        <polygon points="-5,0 65,10 55,165 5,165" fill="url(#suitMain)" stroke="#07090d" stroke-width="2" />
        <polygon points="35,10 65,10 55,165 35,165" fill="url(#suitShadow)" />
        <polygon points="7,162 53,162 55,180 5,180" fill="url(#shirtGrad)" />
        <rect x="14" y="168" width="8" height="8" fill="url(#goldGrad)" />
        <g id="Hand_L" transform="translate(5, 180)">
          <polygon points="2,0 48,0 54,35 42,60 12,60 0,38" fill="url(#skinMid)" stroke="#5e3221" stroke-width="1.5" />
          <polygon points="2,0 28,0 24,52 10,52 0,38" fill="url(#skinLight)" />
          <line x1="14" y1="35" x2="16" y2="55" stroke="#5e3221" stroke-width="2" />
          <line x1="26" y1="35" x2="27" y2="57" stroke="#5e3221" stroke-width="2" />
          <line x1="38" y1="35" x2="38" y2="55" stroke="#5e3221" stroke-width="2" />
        </g>
      </g>
    </g>

    <!-- ================= RIGHT ARM ================= -->
    <g id="Arm_R" transform="translate(585, 310)">
      <g id="UpperArm_R">
        <path d="M-10,0 L-70,15 L-55,195 L15,185 C25,110 15,35 -10,0 Z" fill="url(#suitMain)" stroke="#07090d" stroke-width="2" />
        <polygon points="-12,8 -45,20 -30,175 8,165" fill="#181d27" />
        <polygon points="-45,20 -70,15 -55,195 -30,175" fill="url(#suitShadow)" />
      </g>
      <g id="Forearm_R" transform="translate(10, 180)">
        <polygon points="5,0 -65,10 -55,165 -5,165" fill="url(#suitMain)" stroke="#07090d" stroke-width="2" />
        <polygon points="-35,10 -65,10 -55,165 -35,165" fill="url(#suitShadow)" />
        <polygon points="-7,162 -53,162 -55,180 -5,180" fill="url(#shirtGrad)" />
        <rect x="-56" y="156" width="52" height="14" rx="2" fill="url(#goldGrad)" stroke="#4a3200" stroke-width="1.5" />
        <circle cx="-30" cy="163" r="11" fill="#090d16" stroke="url(#goldGrad)" stroke-width="3" />
        <line x1="-30" y1="163" x2="-25" y2="158" stroke="#ffd700" stroke-width="1.5" />
        <line x1="-30" y1="163" x2="-30" y2="156" stroke="#ffffff" stroke-width="1" />
        <g id="Hand_R" transform="translate(-5, 180)">
          <polygon points="-2,0 -48,0 -54,35 -42,60 -12,60 0,38" fill="url(#skinMid)" stroke="#5e3221" stroke-width="1.5" />
          <polygon points="-2,0 -22,0 -18,52 -5,52 0,38" fill="url(#skinShadow)" opacity="0.6" />
          <line x1="-14" y1="35" x2="-16" y2="55" stroke="#5e3221" stroke-width="2" />
          <line x1="-26" y1="35" x2="-27" y2="57" stroke="#5e3221" stroke-width="2" />
          <line x1="-38" y1="35" x2="-38" y2="55" stroke="#5e3221" stroke-width="2" />
        </g>
      </g>
    </g>

    <!-- ================= TORSO ================= -->
    <g id="Torso">
      <polygon points="330,260 470,260 595,310 205,310" fill="#141821" stroke="#07090d" stroke-width="2" />
      <polygon points="205,310 595,310 535,640 495,705 412,705 400,645 388,705 305,705 265,640" fill="url(#suitMain)" stroke="#07090d" stroke-width="2.5" />
      <polygon points="205,310 315,330 295,520 245,510" fill="#222938" opacity="0.65" />
      <polygon points="595,310 485,330 505,520 555,510" fill="url(#suitShadow)" opacity="0.85" />
      <polygon points="265,640 335,510 385,630 305,705" fill="url(#suitShadow)" opacity="0.7" />
      <polygon points="535,640 465,510 415,630 495,705" fill="url(#suitShadow)" opacity="0.9" />
      <polygon points="335,275 465,275 445,450 400,565 355,450" fill="url(#shirtGrad)" />
      <line x1="375" y1="310" x2="375" y2="500" stroke="#c5cedb" stroke-width="1.5" />
      <line x1="425" y1="310" x2="425" y2="500" stroke="#c5cedb" stroke-width="1.5" />
      <g id="PowerTie">
        <polygon points="382,302 418,302 412,336 388,336" fill="url(#crimsonTie)" stroke="#590209" stroke-width="1.5" />
        <polygon points="388,336 412,336 420,525 400,575 380,525" fill="url(#crimsonTie)" stroke="#590209" stroke-width="1.5" />
        <rect x="379" y="415" width="42" height="7" rx="1.5" fill="url(#goldGrad)" stroke="#5a3e00" stroke-width="1" filter="url(#goldGlow)" />
      </g>
      <polygon points="335,262 400,304 362,332 325,288" fill="#ffffff" stroke="#b0bac9" stroke-width="1.5" />
      <polygon points="465,262 400,304 438,332 475,288" fill="#e6ebf2" stroke="#b0bac9" stroke-width="1.5" />
      <polygon points="325,275 265,335 300,355 285,375 400,575 355,440" fill="url(#lapelGrad)" stroke="#07090d" stroke-width="2" />
      <polygon points="475,275 535,335 500,355 515,375 400,575 445,440" fill="url(#lapelGrad)" stroke="#07090d" stroke-width="2" />
      <circle cx="308" cy="395" r="5" fill="url(#goldGrad)" />
      <polygon points="462,405 492,385 504,402 518,392 515,415 460,415" fill="url(#crimsonTie)" />
      <line x1="458" y1="415" x2="520" y2="415" stroke="url(#goldGrad)" stroke-width="3" />
      <rect x="458" y="415" width="62" height="12" fill="#0b0e14" stroke="#222938" stroke-width="1" />
      <circle cx="400" cy="592" r="7" fill="url(#goldGrad)" stroke="#4a3200" stroke-width="1.5" />
      <circle cx="400" cy="632" r="7" fill="url(#goldGrad)" stroke="#4a3200" stroke-width="1.5" />
    </g>

    <!-- ================= NECK & CHISELED NO-TASWEER CHAD HEAD (NO EYES) ================= -->
    <g id="HeadAndNeck">
      <polygon points="338,200 462,200 468,278 400,308 332,278" fill="url(#skinMid)" />
      <polygon points="338,200 462,200 455,252 400,278 345,252" fill="url(#skinShadow)" />
      <polygon points="342,218 368,232 392,302 350,282" fill="url(#skinLight)" opacity="0.65" />
      <polygon points="458,218 432,232 408,302 450,282" fill="#4a2518" opacity="0.7" />
      <polygon points="386,255 414,255 408,298 392,298" fill="#5e3221" opacity="0.6" />

      <polygon points="322,128 308,134 312,168 326,174" fill="url(#skinMid)" stroke="#5e3221" stroke-width="1.5" />
      <polygon points="478,128 492,134 488,168 474,174" fill="url(#skinShadow)" stroke="#4a2518" stroke-width="1.5" />

      <polygon points="330,82 470,82 480,132 472,175 466,216 400,256 334,216 328,175 320,132" fill="url(#skinLight)" stroke="#5e3221" stroke-width="2" />

      <!-- Right Side Split Lighting Shadow -->
      <polygon points="400,82 470,82 480,132 472,175 466,216 400,256" fill="url(#skinMid)" opacity="0.82" />

      <!-- Forehead & Temple Planes -->
      <polygon points="342,86 400,86 400,122 336,118" fill="#ffe6d4" opacity="0.55" />
      <polygon points="400,86 458,86 464,118 400,122" fill="url(#skinMid)" opacity="0.6" />
      <polygon points="330,82 342,86 336,118 320,132" fill="url(#skinMid)" opacity="0.75" />
      <polygon points="470,82 458,86 464,118 480,132" fill="url(#skinShadow)" opacity="0.85" />

      <!-- Solid Smooth Brow Shelf & Forehead Planes (Completely Clean, No Eye Sockets) -->
      <polygon points="324,118 390,126 400,124 410,126 476,118 472,142 400,150 328,142" fill="url(#skinLight)" opacity="0.6" />
      <polygon points="400,124 476,118 472,142 400,150" fill="url(#skinMid)" opacity="0.45" />
      <line x1="326" y1="120" x2="474" y2="120" stroke="#fff0e5" stroke-width="2" opacity="0.65" />

      <!-- Geometric Chiseled Nasal Bridge Wedge (Faceted Sculpture, No Nostrils) -->
      <polygon points="388,132 400,130 400,174 384,168" fill="#ffe6d4" opacity="0.75" />
      <polygon points="400,130 412,132 416,168 400,174" fill="#6e3b26" opacity="0.9" />
      <polygon points="384,168 400,174 416,168 408,180 392,180" fill="#3d1e12" opacity="0.85" />

      <!-- High Zygomatic Cheekbone Ridges -->
      <polygon points="322,136 338,144 384,152 384,168 354,172 326,154" fill="#ffd8be" opacity="0.6" />
      <polygon points="478,136 462,144 416,152 416,168 446,172 474,154" fill="#b57254" opacity="0.55" />
      <polyline points="325,140 356,158 383,154" fill="none" stroke="#fff0e5" stroke-width="2" opacity="0.7" />
      <polyline points="475,140 444,158 417,154" fill="none" stroke="#e0a382" stroke-width="1.5" opacity="0.45" />

      <!-- Deep Sunken Buccal Cheek Hollows -->
      <polygon points="326,154 364,170 356,198 332,184" fill="url(#skinShadow)" opacity="0.78" />
      <line x1="330" y1="158" x2="358" y2="194" stroke="#472316" stroke-width="2" opacity="0.65" />
      <polygon points="474,154 436,170 444,198 468,184" fill="#3d1e12" opacity="0.88" />
      <line x1="470" y1="158" x2="442" y2="194" stroke="#24100a" stroke-width="2" opacity="0.75" />

      <!-- Sculpted Chiseled Beard & Jawline Armor (No Mouth / No Lips) -->
      <g id="GigaBeard">
        <path d="M326,152 L336,152 L348,188 L374,178 L400,175 L426,178 L452,188 L464,152 L474,152 L468,218 L428,254 L372,254 L332,218 Z" fill="url(#hairGrad)" stroke="#070606" stroke-width="2" />
        <polygon points="362,192 384,176 400,178 400,194 374,198" fill="#3a3332" opacity="0.8" />
        <polygon points="438,192 416,176 400,178 400,194 426,198" fill="#171414" opacity="0.9" />
        <polygon points="370,198 400,194 430,198 420,210 380,210" fill="#070606" opacity="0.9" />
        <polygon points="376,210 400,208 400,252 370,250" fill="#352f2e" opacity="0.65" />
        <polygon points="400,208 424,210 430,250 400,252" fill="#120f0f" opacity="0.8" />
        <polyline points="330,165 346,195 374,250 400,252" fill="none" stroke="#524a48" stroke-width="1.5" opacity="0.65" />
        <polygon points="400,175 426,178 452,188 464,152 474,152 468,218 428,254 400,254" fill="#050404" opacity="0.45" />
      </g>

      <!-- Swept-Back Executive Pompadour Hair -->
      <g id="ExecutiveHair">
        <path d="M322,145 L316,95 C316,60 355,38 412,42 C465,45 488,68 484,102 L478,145 L466,105 L445,88 L355,88 L334,105 Z" fill="url(#hairGrad)" stroke="#070606" stroke-width="2" />
        <path d="M335,88 C355,60 395,52 455,62 C415,65 375,72 355,88 Z" fill="#3d3736" opacity="0.7" />
        <path d="M365,52 C405,40 445,48 475,72 C440,58 400,54 365,52 Z" fill="#4f4846" opacity="0.5" />
        <line x1="342" y1="78" x2="365" y2="92" stroke="#d49372" stroke-width="2" opacity="0.8" />
      </g>
    </g>

  </g>
</svg>
